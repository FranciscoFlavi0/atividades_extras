    <div>
        <h1>Revisão</h1>
    <h2>input simples</h2>
    <input id = "nome">
    <button id = "botao1">Clique</button>
    <div id = "resultado1"></div>

    <h2>select</h2>
    <select id = "cidades">
        <option value = "FOR">Fortaleza</option>
        <option value = "PHB">Parnaíba</option>
        <option value = "SLZ">São Luís</option>
        <option value = "THE">Teresina</option>        
    </select>
    <button id = "botao2">Selecionar</button>
    <div id = "resultado2"></div>

    <h2>checkbox</h2>
    <input type="checkbox" id = "interesse">
    <label for = "interesse">Deseja receber novidades</label>
    <button id = "botao3">Enviar</button>
    <div id = "resultado3"></div>
    </div>
    <div>
        <h2>contando números</h2>
    <input id="texto" placeholder="Texto">
    <button id="botaoContar">Contar carecteres</button>
    <div id="resultado7"></div>

    <h2>letras em maiúsculo</h2>
    <input id="texto8" placeholder="Texto">
    <button id="botaoMaiusculo">Colocar em Maiúsculo</button>

    <h2>maior número</h2>
    <input id="n91" placeholder="Número 1">
    <input id="n92" placeholder="Número 2">
    <button id="botaoMaior">Exibir o maior</button>
    <div id="resultado9"></div>

    <h2>número aleatorio</h2>
    <input id="n101" placeholder="Número 1">
    <input id="n102" placeholder="Número 2">
    <button id="botaoRandomico">Exibir randômico</button>
    <div id="resultado10"></div>
        
    <h2>Cardápio</h2>
    <input id="sanduiche" type="checkbox" value="20">
    <label for="sanduiche">Sanduíche - R$ 20,00</label><br>
    <input id="batata" type="checkbox" value="10">
    <label for="batata">Batata frita - R$ 10,00</label><br>
    <input id="refrigerante" type="checkbox" value="7">
    <label for="refrigerante">Refrigerante - R$ 7,00</label><br>
    <input id="molho" type="checkbox" value="1">
    <label for="molho">Molho - R$ 1,00</label><br>
    <input id="hamburger" type="checkbox" value="12">
    <label for="hamburger">Hamburger extra - R$ 12,00</label><br>
    <button id="botaoCalcularConta">Calcular</button>
    <div id="totalConta"></div>
    </div>
